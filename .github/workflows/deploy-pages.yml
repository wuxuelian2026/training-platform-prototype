name: Deploy training prototype

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: iteration-2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: current/package-lock.json

      - name: Install dependencies
        working-directory: current
        run: npm ci

      - name: Build prototype
        working-directory: current
        run: npm run build

      - name: Build frozen iteration 1 preview
        shell: bash
        run: |
          rm -rf /tmp/iteration-1-source /tmp/iteration-1-dependencies
          mkdir -p /tmp/iteration-1-source
          git archive 01174e0 current | tar -x -C /tmp/iteration-1-source --strip-components=1
          cd /tmp/iteration-1-source
          npm install --no-audit --no-fund --cache /tmp/iteration-1-dependencies
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/current/dist/iteration-1"
          cp -R dist/. "$GITHUB_WORKSPACE/current/dist/iteration-1/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: current/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
