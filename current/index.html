<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- ZK-D-50 D50-2：不用 meta refresh（相对写法会被 SPA 回退按深路径无限追加，绝对写法在 GitHub Pages
       项目子路径与 file:// 下失效）。这里只在「真实入口地址」（以 / 或 /index.html 结尾）执行相对跳转，
       相对目标在根部署、子路径部署与 file:// 三种情况都成立，深路径回退则停在入口页给出链接。 -->
  <script>
    if (location.pathname === '/' || /\/(?:index\.html)?$/.test(location.pathname)) location.replace('learner/index.html');
  </script>
  <title>继续教育小程序原型入口</title>
</head>
<body>
  <p><a href="learner/index.html">打开学员端首页</a></p>
  <p><a href="admin/index.html">进入后台管理端</a></p>
  <p><a href="visualization/index.html">打开运营可视化大屏</a></p>
</body>
</html>
