<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- ZK-D-50 D50-2：与 index.html 同口径——不用 meta refresh，只在真实入口地址执行相对跳转，
       兼容根部署、GitHub Pages 项目子路径与 file://，且深路径回退时不会无限追加。 -->
  <script>
    if (location.pathname === '/' || /\/(?:index\.html)?$/.test(location.pathname)) location.replace('admin/index.html');
  </script>
  <title>培训后台原型入口</title>
</head>
<body>
  <p><a href="admin/index.html">打开培训后台原型</a></p>
