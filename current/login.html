<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>继续教育服务 · 登录</title><link rel="stylesheet" href="./shared/css/tokens.css" /><link rel="stylesheet" href="./shared/css/shell.css" /><link rel="stylesheet" href="./shared/css/mini-program.css" /></head>
<body>
  <main class="mini-login-page">
    <section class="mini-login-card">
      <span class="mp-eyebrow">湖北艺术职业学院 · 继续教育</span>
      <h1>欢迎回来</h1>
      <p>登录后进入你的学习或教学工作区</p>
      <div class="mini-role-switch" role="tablist" aria-label="选择身份">
        <button type="button" data-role="learner" class="active">学员端</button>
        <button type="button" data-role="teacher">教师端</button>
      </div>
      <p id="role-copy" class="mini-role-copy">登录后进入课程、学习、订单和我的</p>
      <div class="mini-login-mode" role="tablist" aria-label="选择登录方式">
        <button type="button" class="active" role="tab" aria-selected="true" data-login-mode="code">验证码登录</button>
        <button type="button" role="tab" aria-selected="false" data-login-mode="password">密码登录</button>
      </div>
      <form id="mini-login-form" class="mp-form">
        <input id="selected-role" type="hidden" value="learner" />
        <div class="mp-field"><label for="demo-account">演示账号</label><select id="demo-account"><option value="account-001">演示家长A · 138****2026</option><option value="account-002">演示家长B · 139****2027</option></select><small>用于验证账号隔离；真实系统由服务端登录账号决定。</small></div>
        <div class="mp-field"><label for="login-phone">手机号</label><input id="login-phone" required pattern="1[3-9][0-9]{9}" placeholder="请输入手机号" value="13800002026" /></div>
        <div class="mp-field" data-login-panel="code"><label for="login-code">验证码</label><div class="mini-code-row"><input id="login-code" required minlength="4" maxlength="6" inputmode="numeric" placeholder="请输入验证码" value="2026" /><button id="login-send-code" type="button" class="mp-button secondary">获取验证码</button></div></div>
        <div class="mp-field" data-login-panel="password" hidden><div class="mini-password-head"><label for="login-password">密码</label><button type="button" data-forgot-password>忘记密码</button></div><input id="login-password" type="password" required minlength="6" maxlength="20" placeholder="请输入6-20位密码" value="123456" disabled /></div>
        <p id="login-message" class="mp-notice" hidden></p>
        <label class="mini-agreement"><input type="checkbox" required checked />我已阅读并同意用户协议、隐私政策</label>
        <button class="mp-button full" type="submit">登录</button>
      </form>
      <button type="button" class="mp-button ghost full" data-wechat-login>微信授权登录</button>
      <p class="mini-login-note">身份切换只影响进入的功能界面，不会改变账号已绑定的业务数据。</p>
    </section>
  </main>
  <script type="module" src="./shared/js/mobile-auth.js"></script>
</body></html>
