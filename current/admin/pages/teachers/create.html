<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>师资中心 · 新增教师</title>
  <link rel="stylesheet" href="../../../shared/css/tokens.css" />
  <link rel="stylesheet" href="../../../shared/css/shell.css" />
  <link rel="stylesheet" href="../../../shared/css/teacher-center.css" />
  <link rel="stylesheet" href="../../../shared/css/rich-editor.css" />
</head>
<body>
  <div data-admin-shell data-title="新增教师" data-active="teachers" data-teacher-page="create">
    <div id="page-content">
      <div class="page-head">
        <div><h1>新增教师</h1><p>第一步建档只填主档，四个页签可自由跳转，提交时跨页签全量校验；保存成功后进入第二步证书录入，可跳过、可中断、可再次进入。</p></div>
        <div class="toolbar-actions"><a class="button" href="list.html">返回教师列表</a></div>
      </div>

      <!-- CR-2026-048：第一步只建主档，四个页签为基本信息／联系与财务／经历与展示／账号，证书输入不在此表单。 -->
      <!-- novalidate：校验由脚本按页签统一执行，避免隐藏页签内的必填项触发浏览器原生校验而阻断提交。 -->
      <form class="card form-card teacher-form" id="teacher-form" novalidate>
        <div class="teacher-tabbar" role="tablist" aria-label="教师建档页签">
          <button type="button" role="tab" id="teacher-tab-basic" aria-controls="teacher-panel-basic" aria-selected="true" data-teacher-tab="basic">基本信息<span class="tab-badge" data-tab-badge="basic"></span></button>
          <button type="button" role="tab" id="teacher-tab-contact" aria-controls="teacher-panel-contact" aria-selected="false" data-teacher-tab="contact">联系与财务<span class="tab-badge" data-tab-badge="contact"></span></button>
          <button type="button" role="tab" id="teacher-tab-experience" aria-controls="teacher-panel-experience" aria-selected="false" data-teacher-tab="experience">经历与展示<span class="tab-badge" data-tab-badge="experience"></span></button>
          <button type="button" role="tab" id="teacher-tab-account" aria-controls="teacher-panel-account" aria-selected="false" data-teacher-tab="account">账号<span class="tab-badge" data-tab-badge="account"></span></button>
        </div>

        <section class="teacher-tabpanel" id="teacher-panel-basic" role="tabpanel" aria-labelledby="teacher-tab-basic" data-teacher-panel="basic">
          <div class="form-section first-form-section"><h2>基本信息</h2><div class="form-grid">
            <label class="form-field"><span>工号</span><input value="JS20260909-003" readonly class="readonly-field" /></label>
            <label class="form-field"><span>姓名 *</span><input name="name" required placeholder="请输入教师姓名" /></label>
            <div class="form-field"><span>人员类型 *</span><div class="choice-group"><label class="choice"><input type="radio" name="person-type" value="在编" required />在编</label><label class="choice"><input type="radio" name="person-type" value="签约" />签约</label><label class="choice"><input type="radio" name="person-type" value="外聘" />外聘</label></div></div>
            <div class="form-field"><span>性别</span><div class="choice-group"><label class="choice"><input type="radio" name="gender" value="男" />男</label><label class="choice"><input type="radio" name="gender" value="女" />女</label></div></div>
            <label class="form-field"><span>出生年月</span><input name="birthday" type="month" /></label>
            <label class="form-field"><span>身份证号 *</span><input name="idCard" required placeholder="18位身份证号，需唯一" /></label>
            <label class="form-field"><span>政治面貌</span><select name="political"><option>请选择</option><option>中共党员</option><option>预备党员</option><option>共青团员</option><option>民主党派</option><option>群众</option></select></label>
            <label class="form-field"><span>民族</span><select name="ethnicity"><option>请选择</option><option>汉族</option><option>回族</option><option>满族</option><option>其他</option></select></label>
            <label class="form-field"><span>最高学历</span><select name="education"><option>请选择</option><option>博士</option><option>硕士</option><option>本科</option><option>大专</option><option>中专</option><option>高中及以下</option></select></label>
            <div class="form-field wide"><span>授课专业 *</span><div class="cascade-controls" data-professional-picker><select name="professional-category" aria-label="授课门类" required><option value="">选择门类</option><option value="音乐类">音乐类</option><option value="舞蹈类">舞蹈类</option><option value="美术类">美术类</option><option value="戏剧类">戏剧类</option></select><select name="professional-group" aria-label="授课分类" required disabled><option value="">请先选择门类</option></select><select name="professional" aria-label="授课专业" disabled><option value="">请先选择分类</option></select><button type="button" class="button" data-action="add-professional">添加专业</button></div><div class="selected-professionals" data-selected-professionals hidden></div></div>
            <label class="form-field"><span>从教年限</span><input name="teachingYears" type="number" min="0" placeholder="单位：年" /></label>
            <label class="form-field"><span>职称</span><select name="title"><option>请选择</option><option>教授</option><option>副教授</option><option>讲师</option><option>助教</option><option>高级教师</option><option>一级教师</option><option>二级教师</option><option>无</option></select></label>
            <label class="form-field"><span>车牌号</span><input name="plateNumber" placeholder="选填" /></label>
          </div></div>
        </section>

        <section class="teacher-tabpanel" id="teacher-panel-contact" role="tabpanel" aria-labelledby="teacher-tab-contact" data-teacher-panel="contact" hidden>
          <div class="form-section first-form-section"><h2>联系方式</h2><div class="form-grid">
            <label class="form-field"><span>手机号 *</span><input name="phone" required pattern="[0-9]{11}" placeholder="11位手机号，需唯一" /></label>
            <label class="form-field"><span>邮箱</span><input name="email" type="email" placeholder="请输入邮箱" /></label>
            <label class="form-field"><span>紧急联系人姓名</span><input name="emergencyName" placeholder="请输入姓名" /></label>
            <label class="form-field"><span>紧急联系人电话</span><input name="emergencyPhone" pattern="[0-9]{11}" placeholder="11位手机号" /></label>
          </div></div>
          <div class="form-section"><h2>财务信息</h2><div class="form-grid">
            <label class="form-field"><span>收款户名</span><input name="payee" placeholder="请输入收款户名" /></label>
            <label class="form-field"><span>银行卡号</span><input name="bankCard" placeholder="请输入银行卡号" /></label>
            <label class="form-field"><span>开户行</span><select name="bank"><option>请选择开户行</option><option>中国工商银行</option><option>中国建设银行</option><option>中国银行</option><option>中国农业银行</option></select></label>
          </div></div>
        </section>

        <section class="teacher-tabpanel" id="teacher-panel-experience" role="tabpanel" aria-labelledby="teacher-tab-experience" data-teacher-panel="experience" hidden>
          <div class="form-section first-form-section"><h2>经历信息</h2><div class="form-grid">
            <label class="form-field wide"><span>学习经历</span><textarea name="studyExperience" placeholder="填写毕业院校、专业和学习时间"></textarea></label>
            <label class="form-field wide"><span>工作经历</span><textarea name="workExperience" placeholder="填写任职单位、岗位和任职时间"></textarea></label>
            <label class="form-field wide"><span>获奖情况</span><textarea name="awards" placeholder="填写艺术或教学相关获奖经历"></textarea></label>
          </div></div>
          <div class="form-section"><h2>展示信息</h2><div class="form-grid">
            <label class="form-field wide"><span>一句话简介</span><textarea name="tagline" maxlength="200" placeholder="用于教师详情、课程介绍和小程序展示，限200字"></textarea></label>
            <div class="form-field wide"><span>简介</span><div data-rich-editor data-name="introduction" data-max-length="2000" data-aria-label="教师简介" data-placeholder="请输入教师艺术经历、教学特色和代表成果" data-min-height="200px"></div></div>
          </div></div>
        </section>

        <section class="teacher-tabpanel" id="teacher-panel-account" role="tabpanel" aria-labelledby="teacher-tab-account" data-teacher-panel="account" hidden>

          <div class="form-section"><h2>账号邀请</h2><div class="form-grid">
            <label class="form-field"><span>邀请手机号</span><input value="使用联系方式中的手机号" readonly class="readonly-field" /></label>
            <label class="form-field"><span>初始账号状态</span><input value="未激活" readonly class="readonly-field" /></label>
            <label class="form-field wide"><span>备注</span><textarea name="remark" placeholder="请输入内部备注"></textarea></label>
          </div></div>
        </section>

        <div class="teacher-build-result" data-build-result hidden role="status"><div><strong>已建档，邀请发送失败</strong><p>教师资料已保存为“已建档”，账号保持“未激活”。请复用当前教师记录重新发送邀请。</p></div><button type="button" class="button" data-action="retry-invite" data-api="API-TEACHER-14">重新发送邀请</button></div>
        <!-- 操作条固定在页签内容之外；提交按钮旁展示必填项完成度。 -->
        <div class="form-actions teacher-form-actions"><a class="button" href="list.html">取消</a><span class="teacher-required-hint" data-required-hint>必填项还差 0 项</span><button type="button" class="button" data-action="save-draft" data-api-action="save_draft">保存草稿</button><button type="submit" class="button primary" data-api-action="complete_and_invite">完成建档</button></div>
      </form>
      <!-- CR-2026-048 §3.2：第二步证书录入与第一步共用同一路由，通过 ?mode=wizard&step=certificate&teacher_id=<id> 进入；可跳过、可中断、可再次进入。 -->
      <section class="card teacher-wizard-step" id="teacher-wizard-certificate" data-wizard-step="certificate" hidden>
        <ol class="teacher-wizard-steps">
          <li class="is-done">第一步 建档<em>已完成</em></li>
          <li class="is-current">第二步 证书录入<em>可跳过</em></li>
        </ol>
        <div class="section-title-row"><div><h2>第二步：证书录入</h2></div><span class="sub-cell" data-wizard-teacher>—</span></div>
        <div data-wizard-certificate-body></div>
      </section>
      <div class="toast" data-teacher-toast role="status" aria-live="polite" hidden></div>
    </div>
  </div>
  <script type="module" src="../../../shared/js/admin-shell.js"></script>
  <script type="module" src="../../../shared/js/teachers.js"></script>
</body>
</html>
