<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>培训后台 · 工作台</title>
  <link rel="stylesheet" href="../shared/css/tokens.css" />
  <link rel="stylesheet" href="../shared/css/shell.css" />
</head>
<body>
  <div data-admin-shell data-title="我的待办" data-active="dashboard">
    <div id="page-content">
      <div class="page-head"><div><h1>我的待办</h1></div><div class="toolbar-actions"><a class="button" href="../visualization/index.html">运营可视化大屏</a><button class="button primary" type="button" data-workbench-refresh>刷新数据</button></div></div>
      <div data-workbench-todos>
      <div class="card-grid">
        <div class="card"><div class="metric-label">在招生班级</div><div class="metric-value">12</div><div class="metric-note">较上周 +2</div></div>
        <div class="card"><div class="metric-label">待处理事项</div><div class="metric-value" data-todo-count>0</div><div class="metric-note">按当前角色权限统计</div></div>
        <div class="card"><div class="metric-label">本月有效课时</div><div class="metric-value">286</div><div class="metric-note">已完成课次143</div></div>
        <div class="card"><div class="metric-label">高优先级异常</div><div class="metric-value" data-overdue-count>0</div><div class="metric-note">需优先处理</div></div>
      </div>
      <div class="card"><div class="toolbar"><strong>重点待办</strong><span class="tag brand">实时汇总</span></div><div data-todo-list></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="../shared/js/admin-shell.js"></script>
  <script type="module" src="../shared/js/workbench-todos.js"></script>
</body>
</html>
